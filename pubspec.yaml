name: batak
description: "A high-performance, offline-first tactical gym tracker."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Phase 1 & 2 Core Packages ---
  # State Architecture
  flutter_riverpod: ^2.5.1
  
  # Offline SQLite Database
  drift: ^2.16.0
  drift_flutter: ^0.1.0 
  sqlite3_flutter_libs: ^0.5.24

  # Local Math/AI Vector Engine
  vector_math: ^2.1.4
  intl: ^0.20.2
  flutter_body_heatmap: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # --- Code Generation Tools for Drift & Riverpod ---
  build_runner: ^2.4.9
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true

  # Our local AI Biomechanical Matrix
  assets:
    - assets/data/
    